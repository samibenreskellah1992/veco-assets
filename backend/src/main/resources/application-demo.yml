# Profil pour une demonstration (ex: presentation DSI / Direction Generale) :
# memes donnees de demo que le profil dev, mais sans les logs SQL verbeux.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Meme raison que le profil dev (voir application-dev.yml) : une base
    # demo deja seedee (V900) rendrait toute nouvelle migration de schema
    # ulterieure "out of order" par defaut.
    out-of-order: true

logging:
  level:
    dz.vecopharm.vecoassets: INFO
