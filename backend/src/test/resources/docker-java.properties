# Contournement Phase 10 (troubleshooting mvn test) : Docker Desktop 29.x exige une
# API >= 1.44, mais le client docker-java embarque dans Testcontainers 1.19.8 (notre
# version) retombe sur l'API 1.32 par defaut et se fait rejeter par le moteur avec une
# reponse vide/HTTP 400 ("Could not find a valid Docker environment"). On epingle donc
# explicitement la version d'API negociee par le client. Voir testcontainers-java#11212
# et #11235 (Docker Engine 29 casse Testcontainers 1.x). Solution durable a terme :
# migrer vers Testcontainers 2.x qui negocie automatiquement l'API avec le demon.
api.version=1.44
